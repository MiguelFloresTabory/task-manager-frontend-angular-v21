<div class="min-h-screen w-full bg-slate-950 text-slate-200 flex">
  <!-- OVERLAY MOBILE -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/50 z-40 md:hidden" (click)="toggleSidebar()"></div>
  }

  <!-- SIDEBAR -->
  <aside
    class="fixed md:static z-50 top-0 left-0 h-screen md:h-auto w-72 bg-slate-900 border-r border-slate-800 transform transition-transform duration-300 flex flex-col"
    [ngClass]="{
      '-translate-x-full': !sidebarOpen(),
      'translate-x-0': sidebarOpen(),
      'md:translate-x-0': true,
    }"
  >
    <!-- Logo -->
    <div class="p-4 md:p-6 border-b border-slate-800 flex items-center gap-3">
      <div class="h-10 w-10 rounded-full bg-blue-600 flex items-center justify-center font-bold">
        T
      </div>
      <div>
        <p class="font-semibold">{{ envs.title }}</p>
        <p class="text-xs text-slate-400">Individual Plan</p>
      </div>
    </div>

    <!-- Nav -->
    <menu-options></menu-options>

    <div class="mt-auto p-4">
      <button class="w-full bg-blue-600 hover:bg-blue-500 transition rounded-xl py-3 font-medium">
        + New Project
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col">
    <!-- HEADER -->
    <header class="border-b border-slate-800 p-4 md:p-6 flex items-center gap-4">
      <!-- HAMBURGER MOBILE -->
      <button
        class="md:hidden h-10 w-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center"
        (click)="toggleSidebar()"
      >
        ☰
      </button>

      <h1 class="text-lg md:text-xl font-semibold">Today</h1>

      <div class="flex-1">
        <input
          type="text"
          placeholder="Search tasks..."
          class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"
        />
      </div>

      <button
        (click)="openModalAddTask()"
        class="bg-blue-600 px-2 sm:px-4 py-2 text-sm sm:text-base rounded-xl whitespace-normal min-w-0"
      >
        + Add Task
      </button>
    </header>

    
    <!-- RIGHT PANEL EDIT -->
    <right-panel></right-panel>
    <!-- MODAL CREATE -->
    <modal-addtask></modal-addtask>
    <modal-confirm></modal-confirm>
    <loading></loading>
    <!-- ROUTER -->
    <router-outlet />
  </main>
</div>
